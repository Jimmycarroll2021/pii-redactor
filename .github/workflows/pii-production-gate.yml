name: PII production gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run deterministic production gate
        run: |
          python scale-tests/run_production_gate.py \
            --registry scale-tests/fixtures/registry-ci.json \
            --skip-encrypted-audit \
            --out scale-tests/runs/ci-production-gate
      - name: Dump gate results on failure
        if: failure()
        run: |
          for f in scale-tests/runs/ci-production-gate/*.json; do
            echo "===== $f ====="
            cat "$f"
            echo
          done
